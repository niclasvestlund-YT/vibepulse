# CI: the two lanes that are rock solid on headless runners.
# Lane 3 (the full host gate incl. SDL landmark captures) needs display
# plumbing on CI and is tracked as a follow-up issue.
name: CI

on:
  push:
    # Alla brancher: OTA-pusharens CI-brygga vägrar leverera byggen utan
    # grön CI för exakt sin commit (2026-08-14) — då måste varje pushad
    # commit också få en dom. Concurrency-gruppen håller kostnaden nere.
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tokenserver:
    # The service is supported on three platforms, so it is tested on three.
    # The platform branches are the whole point: state paths, the credential
    # source and the probe lock differ per OS, and a test that pins one
    # platform while running on another has already shipped once (macOS tests
    # asserted their paths against the Linux branch on this very runner).
    # fail-fast stays off — when one OS breaks, the others' verdicts are the
    # information you actually want.
    name: Tokenserver tests (Python stdlib) — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # bash on every runner: the default shell on windows-latest is
      # PowerShell, where a trailing \ is not a line continuation and this
      # command would run as seven broken fragments.
      - name: Run tokenserver unit tests
        shell: bash
        run: |
          # Same eleven modules as test/run.sh, same order. The lists
          # drifting apart is how a green CI hid a runtime NameError in
          # PR #11 (test_interactions was missing) — keep them in sync.
          python -m unittest \
            tools.tokenserver.test_github_monitor \
            tools.tokenserver.test_tokenserver \
            tools.tokenserver.test_agent_status \
            tools.tokenserver.test_usage_history \
            tools.tokenserver.test_quota_cache \
            tools.tokenserver.test_max_tracker \
            tools.tokenserver.test_value_meter \
            tools.tokenserver.test_update_prices \
            tools.tokenserver.test_codex_usage \
            tools.tokenserver.test_interactions \
            tools.tokenserver.test_smoke -v

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI has no real WiFi or LAN service. Build the opt-in path anyway so
      # GitHub UI/network code cannot rot behind its default-off switches.
      - name: Create CI secrets.h with optional GitHub module enabled
        run: |
          cp secrets.h.example secrets.h
          sed -i 's/TK_GITHUB_SCREEN_ENABLED 0/TK_GITHUB_SCREEN_ENABLED 1/' secrets.h
          sed -i 's/TK_GITHUB_NOTIFICATIONS_ENABLED 0/TK_GITHUB_NOTIFICATIONS_ENABLED 1/' secrets.h
          sed -i 's/TK_GITHUB_SOUND_ENABLED 0/TK_GITHUB_SOUND_ENABLED 1/' secrets.h
      - name: Build with ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.2
          target: esp32s3
          command: idf.py build
