# CI: the whole repository gate, not a subset. The host-gate job runs the
# same ./test/run.sh a maintainer runs at the bench — C binaries, wiring
# tests, the Mbed TLS crypto vectors (against the exact IDF-pinned sources)
# and the SDL landmark captures under xvfb (OBS-24). Only the JS suites are
# skipped inside run.sh (--skip-js): the npm-cached interaction-relay and
# numbers-relay jobs run their Worker suites independently.
name: CI

on:
  push:
    # Alla brancher: OTA-pusharens CI-brygga vägrar leverera byggen utan
    # grön CI för exakt sin commit (2026-08-14) — då måste varje pushad
    # commit också få en dom. Concurrency-gruppen håller kostnaden nere.
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One version for the firmware build AND the Mbed TLS sources the host
  # gate's C crypto vectors compile against — bump them together, or the
  # vectors stop guarding the bytes the panel actually ships.
  IDF_VERSION: v5.5.2

jobs:
  host-gate:
    name: Host gate (./test/run.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the pinned host-gate Python dependencies
        run: >
          python -m pip install -r requirements-dev.txt
          -r requirements-interaction-relay.txt
      - name: Install SDL2, Ninja and xvfb for the simulator landmarks
        run: >
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends
          libsdl2-dev ninja-build xvfb
      # The vectors test compiles the panel's AES-GCM/HKDF boundary against
      # ESP-IDF's bundled Mbed TLS. Only those sources are needed — no
      # xtensa toolchain — so a sparse clone (~70 MB, seconds) suffices.
      - name: Fetch ESP-IDF's pinned Mbed TLS for the C crypto vectors
        run: |
          git clone --depth 1 --branch "$IDF_VERSION" --filter=blob:none \
            --sparse https://github.com/espressif/esp-idf.git \
            "$RUNNER_TEMP/esp-idf-mbedtls"
          git -C "$RUNNER_TEMP/esp-idf-mbedtls" sparse-checkout set \
            components/mbedtls
          git -C "$RUNNER_TEMP/esp-idf-mbedtls" submodule update --init \
            --depth 1 components/mbedtls/mbedtls
      - name: Run the full host gate under a virtual display
        env:
          IDF_PATH: ${{ runner.temp }}/esp-idf-mbedtls
        run: xvfb-run -a ./test/run.sh --skip-js

  interaction-relay:
    name: Encrypted interaction Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/interaction-relay/package-lock.json
      - name: Verify the pinned Worker and privacy boundary
        working-directory: tools/interaction-relay
        run: npm ci && npm test && npm run typecheck

  numbers-relay:
    name: Numbers relay Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tools/relay/package-lock.json
      - name: Run relay mailbox merge tests
        run: node --test tools/relay/test.mjs
      - name: Run relay Durable Object tests
        run: (cd tools/relay && npm ci && npm test)
      - name: Dry-build both relay deployment stages
        run: (cd tools/relay && npm run build:dry)

  tokenserver:
    name: Tokenserver tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the optional encrypted-relay dependency
        shell: bash
        run: python -m pip install -r requirements-interaction-relay.txt
      - name: Run tokenserver unit tests
        shell: bash
        run: |
          # The module list lives in test/tokenserver-suite.txt, shared with
          # test/run.sh. Two lists drifting apart is how a green CI hid a
          # runtime NameError in PR #11 (test_interactions was missing) —
          # now one list exists and run.sh guards its completeness.
          python -m unittest \
            $(tr -d '\r' < test/tokenserver-suite.txt | grep -v '^#') -v
      - name: Run setup integration tests on Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: python test/test_vibepulse_codex_plugin.py
      - name: Validate the Windows Task Scheduler installer without installing
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $allErrors = @()
          foreach ($script in @(
            'tools\tokenserver\install-windows-task.ps1',
            'tools\tokenserver\run-windows-task.ps1',
            'test\windows-task-runner.ps1'
          )) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $allErrors += $parseErrors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          .\tools\tokenserver\install-windows-task.ps1 -ValidateOnly `
            -GithubRepo "owner/repository" -ClaudePlan max5x `
            -CodexPlan pro -ClaudePlanCostUsd "100" `
            -CodexPlanCostUsd "20"
          .\test\windows-task-runner.ps1

  snapshot-tool:
    # tools/snapshot.sh är backupen AGENTS.md kräver före varje
    # historikomskrivning, och den körs på maintainerns Mac. Tre av de fem
    # defekter granskningen hittade i filen — awk med NUL som RS, `head -c -1`
    # och `mktemp` utan mall — är OSYNLIGA på Linux: GNU:s verktyg gör precis
    # vad skriptet ber om. Matrisen är därför inte lyx. Ubuntu ensamt fångar
    # ingen av dem, och testets statiska vakter är en andra linje, inte en
    # ersättning för att faktiskt köra filen mot BSD-verktygen.
    #
    # Eget jobb i stället för en gren i tokenserverjobbet: det kör också
    # windows-latest, där ett bash-verktyg inte hör hemma, och installerar
    # beroenden det här testet inte har — det klarar sig på stdlib och git.
    name: Snapshot tool (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the backup tool against synthetic repositories
        shell: bash
        run: python test/test_snapshot_tool.py
      # Ett KOMPLEMENT, inte en ersättning: shellcheck flaggar varken
      # RS="\0" eller en mktemp utan mall. Bara snapshot.sh, för hela
      # tools/*.sh är rött idag av skäl som inte hör hit — flasha.sh är zsh
      # (SC1071, shellcheck kan inte läsa den alls), och `CDPATH= cd` i
      # install-local-skills.sh och preview-ui.sh ger SC1007 fast idiomet är
      # rätt. Att städa det är sitt eget ärende.
      - name: Shellcheck the backup tool
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends shellcheck
          fi
          shellcheck tools/snapshot.sh

  firmware:
    name: ESP32-S3 firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # CI has no real WiFi or LAN service. Build the opt-in path anyway so
      # GitHub UI/network code cannot rot behind its default-off switches.
      - name: Create CI secrets.h with optional GitHub module enabled
        run: |
          cp secrets.h.example secrets.h
          sed -i 's/TK_GITHUB_SCREEN_ENABLED 0/TK_GITHUB_SCREEN_ENABLED 1/' secrets.h
          sed -i 's/TK_GITHUB_NOTIFICATIONS_ENABLED 0/TK_GITHUB_NOTIFICATIONS_ENABLED 1/' secrets.h
          sed -i 's/TK_GITHUB_SOUND_ENABLED 0/TK_GITHUB_SOUND_ENABLED 1/' secrets.h
      - name: Build with ESP-IDF 5.5
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ env.IDF_VERSION }}
          target: esp32s3
          command: idf.py build
