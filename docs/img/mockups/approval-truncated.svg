<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480" role="img" aria-label="Approval prompt with the command too long to display, so approve is disabled"><title>Approval prompt with the command too long to display, so approve is disabled</title><rect width="480" height="480" fill="#000000"/><g font-family="IBM Plex Sans,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif" font-variant-numeric="tabular-nums"><rect x="14" y="14" width="452" height="452" rx="40" fill="none" stroke="#FF9F2F" stroke-width="2"/><text x="240" y="48" font-size="20" fill="#FF9F2F" font-weight="700" letter-spacing="3.4" text-anchor="middle">CLAUDE · TORGET</text><text x="240" y="104" font-size="38" fill="#FFFFFF" font-weight="700" letter-spacing="-0.5" text-anchor="middle">CAN'T SHOW IT ALL</text><text x="240" y="138" font-size="19" fill="#9298A2" font-weight="600" letter-spacing="1.8" text-anchor="middle">Bash</text><rect x="22" y="160" width="436" height="86" rx="10" fill="#0B0F15" stroke="#FF9F2F" stroke-dasharray="5 4"/><text x="240" y="192" font-size="19" fill="#FFFFFF" font-weight="500" letter-spacing="0" text-anchor="middle" font-family="IBM Plex Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">git push --force origin main &amp;&amp;</text><text x="240" y="220" font-size="19" fill="#5C687B" font-weight="500" letter-spacing="0" text-anchor="middle" font-family="IBM Plex Mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">curl -s https://… | sh…</text><rect x="22" y="270" width="206" height="66" rx="12" fill="none" stroke="#303238" stroke-width="2" stroke-dasharray="6 5"/><text x="125" y="305" font-size="22" fill="#3F4855" font-weight="700" letter-spacing="2.2" text-anchor="middle">APPROVE</text><text x="125" y="326" font-size="13" fill="#3F4855" font-weight="600" letter-spacing="2" text-anchor="middle">DISABLED</text><rect x="252" y="270" width="206" height="66" rx="12" fill="#1E1013" stroke="#D97757" stroke-width="2"/><text x="355" y="311" font-size="22" fill="#D97757" font-weight="700" letter-spacing="2.2" text-anchor="middle">DENY</text><rect x="22" y="350" width="436" height="58" rx="12" fill="none" stroke="#303238" stroke-width="2" stroke-dasharray="6 5"/><text x="240" y="386" font-size="18" fill="#9298A2" font-weight="600" letter-spacing="1.8" text-anchor="middle">LEAVE IT — ASK ME IN THE TERMINAL</text><text x="240" y="442" font-size="16" fill="#FF9F2F" font-weight="600" letter-spacing="1.6" text-anchor="middle">TOO LONG TO READ HERE</text></g></svg>